[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainkeeper"
version = "0.1.0"
description = "A zero-dependency training infrastructure layer: crash-safe resumption, RNG time-travel, online loss diagnosis, and budget control for any Python training loop."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "liuDH" }]
keywords = [
    "deep-learning", "training", "pytorch", "checkpoint", "resume",
    "reproducibility", "experiment-tracking", "diagnostics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
numpy = ["numpy"]
torch = ["torch"]

[project.scripts]
tk = "trainkeeper.__main__:main"

[tool.setuptools]
packages = ["trainkeeper"]

[tool.setuptools.package-data]
trainkeeper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
